<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>ページが見つかりません — gmoriki</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #171b18;
        background: #fff;
        font:
          17px/1.9 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 100px max(28px, 6vw);
      }
      .name {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.06em;
        color: inherit;
        text-decoration: none;
      }
      .code {
        margin-top: 88px;
        color: #595959;
      }
      h1 {
        margin: 24px 0;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.5;
        font-weight: 400;
        word-break: keep-all;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin-top: 48px;
      }
      nav a {
        color: #165940;
        text-underline-offset: 6px;
      }
      a:focus-visible {
        outline: 3px solid #165940;
        outline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="name" href="/">gmoriki</a>
      <p class="code">404</p>
      <h1>ページが<wbr />見つかりません。</h1>
      <p>URLが変更されたか、ページが存在しない可能性があります。</p>
      <nav aria-label="サイト内のページ">
        <a href="/">トップ</a><a href="/works/">Works</a
        ><a href="/profile/">プロフィール</a>
      </nav>
    </main>
  </body>
</html>
